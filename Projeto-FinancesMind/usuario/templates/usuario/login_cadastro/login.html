{% extends 'usuario/base_login.html' %}
{% load static %}

{% block title %}Entrar{% endblock title %}
{% block extralink %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
{% endblock extralink%}

{% block content %}
        <div class="container">
            <form id="formLogin" onsubmit="validarLoginESeguir(event)">
                <fieldset>
                    <legend><h1 class="title">Entrar</h1></legend>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    
                    <div>
                        <label for="senha">Senha:</label>
                        <input type="password" name="senha" id="senha" required>
                        <a href="{% url 'usuario:resetPassword' %}" class="forgot-password">Esqueci minha senha</a>
                        <a href="{% url 'usuario:signin' %}" class="forgot-password">Criar uma conta</a>
                        
                    </div>
                    
                    <button type="submit" id="button">Continuar</button>

                </fieldset>
            </form>
        </div>
{% endblock content%}

{% block scripts %}
    <script src="{% static 'usuario/js/form-validacao.js' %}"></script>
{% endblock scripts %}
