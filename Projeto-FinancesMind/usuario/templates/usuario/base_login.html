{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Finances Mind - {% block title %}{% endblock title %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'usuario/css/login_signin.css' %}">
    <link rel="shortcut icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    {% block extralink %}
    {% endblock extralink %}
</head>
<body>
    <header class="logo-login">
        <a href="{% url 'home' %}">
            <img src="{% static 'img/FMicon.jpg' %}" alt="logo do sistema (FinancesMind)" width="72px">
        </a>
    </header>
    <main class="content">
        {% block content %}
        {% endblock content %}
    </main>
    
    {% block scripts %}
    {% endblock scripts %}
</body>
</html>
